# Terraform destroy stage.
# To change TF_VERSION, also update TF_SHA256 with the checksum for terraform_<version>_linux_amd64.zip
# from https://releases.hashicorp.com/terraform/<version>/terraform_<version>_SHA256SUMS
version: 0.2
env:
  variables:
    CODE_SRC_DIR: "."
    TF_VERSION: "1.17.2"
    TF_SHA256: "e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b"
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - "curl -sSfL -o terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - "echo \"${TF_SHA256}  terraform.zip\" | sha256sum -c -"
      - "unzip -o terraform.zip terraform"
      - "mv terraform /usr/local/bin/terraform"
      - "rm terraform.zip"
  build:
    commands:
      - "cd ${CODEBUILD_SRC_DIR}/${CODE_SRC_DIR}"
      - "echo ## TERRAFORM DESTROY : Starting with the Terraform Destroy"
      - "terraform destroy -input=false -auto-approve"
artifacts:
  files:
    - '**/*'
